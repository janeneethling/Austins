<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notification Keys</title>
<style>
  :root { --bg:#FFF8EF; --card:#fff; --ink:#2B2118; --muted:#8A7B6C; --coral:#FF6B4A; --line:#F0E4D4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1B1714; --card:#26201B; --ink:#F7EEE4; --muted:#A99A8A; --line:#3A312A; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system,system-ui,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:24px 16px; }
  h1 { font-family: ui-rounded, -apple-system, system-ui; }
  .card { background:var(--card); border-radius:18px; padding:16px; margin:12px 0; box-shadow:0 2px 10px rgba(0,0,0,.06); }
  label { font-weight:700; font-size:14px; color:var(--muted); display:block; margin-bottom:6px; }
  textarea { width:100%; box-sizing:border-box; font:13px ui-monospace,Menlo,monospace; padding:10px; border-radius:12px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); resize:none; }
  button { font:inherit; font-weight:700; border:0; border-radius:12px; padding:10px 16px; background:var(--coral); color:#fff; cursor:pointer; margin-top:8px; }
  .muted { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>🔑 Notification keys</h1>
  <p class="muted">These keys are made in your browser and are never sent anywhere. Generate them <b>once</b> and keep them safe – if you make new ones later, everybody has to switch notifications off and on again.</p>
  <button id="gen">Generate keys</button>
  <div id="out" hidden>
    <div class="card"><label>VAPID_PUBLIC_KEY → send to Claude (or put in js/config.js) AND Supabase secrets</label><textarea id="pub" rows="3" readonly></textarea><button data-copy="pub">Copy</button></div>
    <div class="card"><label>VAPID_PRIVATE_KEY → Supabase secrets ONLY (keep private!)</label><textarea id="priv" rows="2" readonly></textarea><button data-copy="priv">Copy</button></div>
    <div class="card"><label>CRON_SECRET → Supabase secrets AND the notifications SQL</label><textarea id="cron" rows="2" readonly></textarea><button data-copy="cron">Copy</button></div>
  </div>
</main>
<script>
const b64url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
document.getElementById('gen').onclick = async () => {
  const kp = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
  const pub = await crypto.subtle.exportKey('raw', kp.publicKey);
  const jwk = await crypto.subtle.exportKey('jwk', kp.privateKey);
  document.getElementById('pub').value = b64url(pub);
  document.getElementById('priv').value = jwk.d;
  document.getElementById('cron').value = b64url(crypto.getRandomValues(new Uint8Array(24)));
  document.getElementById('out').hidden = false;
};
document.addEventListener('click', async (e) => {
  const id = e.target.dataset.copy; if (!id) return;
  await navigator.clipboard.writeText(document.getElementById(id).value);
  e.target.textContent = 'Copied!'; setTimeout(() => (e.target.textContent = 'Copy'), 1500);
});
</script>
</body>
</html>
